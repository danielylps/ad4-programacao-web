<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Cadastro de Professores</title>
</head>
    <body>
        <header>
            <div class="logo-titulo">
                <img src="img/logo.png" alt="Logo do IFC" class="logo">
                <h1>Gestão Acadêmica</h1>
                <div class="espaco"></div>
            </div>
            <nav>
                <ul>
                    <li><a href="cursos.html">Cadastro de Cursos</a></li>
                    <li><a href="professores.html">Cadastro de Professores</a></li>
                </ul>
            </nav>
        </header>
        <main>
            <button id="addProfessor">Adicionar Professor</button>
                <table id="professoresTable">
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Email</th>
                            <th>Sala</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                <tbody>
                    <!-- Preenchido pelo JS -->
                </tbody>
            </table>

        </main>

        <!-- Modal -->
        <div id="professorModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>

                <h2>Adicionar/Editar Professor</h2>

                <form id="professorForm">
                    <input type="hidden" id="idProfessor">

                    <label>Nome:</label>
                    <input type="text" id="nome" required>

                    <label>Email:</label>
                    <input type="email" id="email" required>

                    <label>Sala:</label>
                    <input type="text" id="sala" required>

                    <button type="submit">Salvar</button>
                </form>
            </div>
        </div>
        <script src="professores.js"></script>
    </body>
</html>
