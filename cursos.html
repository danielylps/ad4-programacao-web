<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Início</title>
</head>
    <body>
        <header>
            <div class="logo-titulo">
                <img src="img/logo.png" alt="Logo do IFC" class="logo">
                <h1>Gestão Acadêmica</h1>
                <div class="espaco"></div>
            </div>
            <nav>
                <ul>
                    <li><a href="cursos.html">Cadastro de Cursos</a></li>
                    <li><a href="professores.html">Cadastro de Professores</a></li>
                </ul>
            </nav>
        </header>
        <main>
            <button id="addCurso">Adicionar Curso</button>
                <table id="cursosTable">
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Sigla</th>
                            <th>Coordenador</th>
                        <th>Ações</th>
                        </tr>
                    </thead>
                <tbody>
                    <!-- Cursos serão inseridos aqui via JavaScript -->
                </tbody>
            </table>
        </main>
        
        <!-- Modal para Adicionar/Editar Curso -->
        <div id="cursoModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2>Adicionar/Editar Curso</h2>
                    <form id="cursoForm">
                        <input type="hidden" id="cursoId">

                        <label for="nomeCurso">Nome do Curso:</label>
                        <input type="text" id="nomeCurso" required>

                        <label for="sigla">Sigla:</label>
                        <input type="text" id="sigla" required>

                        <label for="coordenador">Coordenador:</label>
                        <input type="text" id="coordenador" required>

                        <button type="submit">Salvar</button>
                    </form>
            </div>
        </div>
        <script src="cursos.js"></script>
    </body>
</html>
